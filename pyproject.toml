[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-guard"
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[project.scripts]
dev-guard = "dev_guard.cli:main"

[tool.setuptools]
packages = ["dev_guard"]

[tool.setuptools.package-data]
dev_guard = ["iocs.json"]

[tool.setuptools.dynamic]
version = {attr = "dev_guard.__version__"}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
